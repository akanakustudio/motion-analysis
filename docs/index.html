<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion 3D Prototype</title>
<style>
  :root{
    --bg:#0b0e12;
    --panel:#12161c;
    --line:#232a33;
    --accent:#4fd1c5;
    --accent2:#f6ad55;
    --text:#e6edf3;
    --muted:#8b98a5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;}
  .app{display:flex;flex-direction:column;height:100%;}
  header{padding:12px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em;}
  header .sub{font-size:11px;color:var(--muted);}
  .status{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
  .status.live{color:var(--accent);border-color:var(--accent);}
  main{flex:1;position:relative;overflow:hidden;background:#000;}
  #videoWrap{position:relative;width:100%;height:100%;}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  canvas{position:absolute;inset:0;width:100%;height:100%;}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:24px;}
  .hint p{color:var(--muted);font-size:13px;max-width:280px;margin:0;}
  button{background:var(--accent);color:#04201d;border:none;border-radius:8px;
    padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{background:#2a3138;color:var(--muted);cursor:default;}
  button.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .controls{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;align-items:center;}
  .metrics{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;
    flex-wrap:wrap;pointer-events:none;}
  .chip{background:rgba(18,22,28,.85);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:11px;color:var(--muted);backdrop-filter:blur(4px);}
  .chip b{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums;}
  .chip.warn b{color:var(--accent2);}
  footer{padding:8px 16px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);
    line-height:1.5;}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Markerless Motion — 3D Pose Prototype</h1>
      <div class="sub">MediaPipe BlazePose (world landmarks) / ブラウザ内推論</div>
    </div>
    <div id="statusBadge" class="status">未起動</div>
  </header>

  <main>
    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="metrics" id="metrics" style="display:none;"></div>
      <div class="hint" id="hint">
        <p>スマホを縦か横に固定し、全身が映る距離(2〜3m)からカメラを起動してください。単眼カメラのため、正面〜斜め45度からの撮影が最も安定します。</p>
        <button id="startBtn">カメラを起動</button>
      </div>
    </div>
  </main>

  <div class="controls">
    <button id="toggleCamBtn" class="secondary" disabled>前後カメラ切替</button>
    <select id="exerciseSelect" disabled>
      <option value="generic">汎用(全関節)</option>
      <option value="squat">スクワット(膝・股関節角度)</option>
      <option value="pitch">投球フォーム(肘・肩角度)</option>
    </select>
    <button id="recordBtn" class="secondary" disabled>ログ記録 開始</button>
  </div>

  <footer>
    プロトタイプ版。単眼カメラのため3D座標は相対値(奥行きスケールは未較正)であり、絶対距離・角度は参考値です。高速動作では検出が乱れる場合があります。
  </footer>
</div>

<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "@mediapipe/tasks-vision";

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startBtn');
const toggleCamBtn = document.getElementById('toggleCamBtn');
const recordBtn = document.getElementById('recordBtn');
const exerciseSelect = document.getElementById('exerciseSelect');
const hint = document.getElementById('hint');
const statusBadge = document.getElementById('statusBadge');
const metricsEl = document.getElementById('metrics');

let poseLandmarker = null;
let currentStream = null;
let facingMode = 'environment';
let running = false;
let lastVideoTime = -1;
let recording = false;
let logRows = [];
let fpsCounter = { last: performance.now(), frames: 0, fps: 0 };

// --- One Euro Filter (simple smoothing per-landmark to reduce jitter) ---
class OneEuro {
  constructor(minCutoff=1.2, beta=0.03){
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = 1.0;
    this.xPrev = null; this.dxPrev = 0; this.tPrev = null;
  }
  alpha(cutoff, dt){
    const tau = 1/(2*Math.PI*cutoff);
    return 1/(1+tau/dt);
  }
  filter(x, t){
    if(this.tPrev===null){ this.tPrev=t; this.xPrev=x; return x; }
    const dt = Math.max((t-this.tPrev)/1000, 1/120);
    const aD = this.alpha(this.dCutoff, dt);
    const dx = (x-this.xPrev)/dt;
    const dxHat = aD*dx + (1-aD)*this.dxPrev;
    const cutoff = this.minCutoff + this.beta*Math.abs(dxHat);
    const a = this.alpha(cutoff, dt);
    const xHat = a*x + (1-a)*this.xPrev;
    this.xPrev = xHat; this.dxPrev = dxHat; this.tPrev = t;
    return xHat;
  }
}
let filters = null; // array of {x,y,z: OneEuro} per landmark index

function initFilters(n){
  filters = Array.from({length:n}, ()=>({x:new OneEuro(), y:new OneEuro(), z:new OneEuro()}));
}

async function initModel(){
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

async function startCamera(){
  statusBadge.textContent = 'モデル読み込み中…';
  try{
    if(!poseLandmarker) await initModel();
  }catch(e){
    statusBadge.textContent = 'モデル読込失敗';
    alert('姿勢推定モデルの読み込みに失敗しました。ネットワーク接続を確認してください。\n' + e.message);
    return;
  }

  try{
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width:{ideal:960}, height:{ideal:1280} },
      audio: false
    });
  }catch(e){
    statusBadge.textContent = 'カメラ許可なし';
    alert('カメラへのアクセスが許可されませんでした。');
    return;
  }

  video.srcObject = currentStream;
  await video.play();
  resizeCanvas();
  hint.style.display = 'none';
  metricsEl.style.display = 'flex';
  toggleCamBtn.disabled = false;
  exerciseSelect.disabled = false;
  recordBtn.disabled = false;
  statusBadge.textContent = '推定中';
  statusBadge.classList.add('live');
  running = true;
  requestAnimationFrame(loop);
}

function resizeCanvas(){
  canvas.width = video.videoWidth || video.clientWidth;
  canvas.height = video.videoHeight || video.clientHeight;
}

function angleBetween(a, b, c){
  // angle at point b, using 3D world coords
  const v1 = {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z};
  const v2 = {x:c.x-b.x, y:c.y-b.y, z:c.z-b.z};
  const dot = v1.x*v2.x + v1.y*v2.y + v1.z*v2.z;
  const m1 = Math.hypot(v1.x,v1.y,v1.z);
  const m2 = Math.hypot(v2.x,v2.y,v2.z);
  if(m1===0||m2===0) return null;
  const cos = Math.min(1, Math.max(-1, dot/(m1*m2)));
  return Math.acos(cos) * 180/Math.PI;
}

const LM = {
  L_SHOULDER:11, R_SHOULDER:12, L_ELBOW:13, R_ELBOW:14, L_WRIST:15, R_WRIST:16,
  L_HIP:23, R_HIP:24, L_KNEE:25, R_KNEE:26, L_ANKLE:27, R_ANKLE:28
};

function computeMetrics(world, mode){
  const m = {};
  if(!world) return m;
  const g = i => world[i];
  if(mode==='squat'){
    m['右膝角度'] = angleBetween(g(LM.R_HIP), g(LM.R_KNEE), g(LM.R_ANKLE));
    m['左膝角度'] = angleBetween(g(LM.L_HIP), g(LM.L_KNEE), g(LM.L_ANKLE));
    m['右股関節角度'] = angleBetween(g(LM.R_SHOULDER), g(LM.R_HIP), g(LM.R_KNEE));
  } else if(mode==='pitch'){
    m['右肘角度'] = angleBetween(g(LM.R_SHOULDER), g(LM.R_ELBOW), g(LM.R_WRIST));
    m['左肘角度'] = angleBetween(g(LM.L_SHOULDER), g(LM.L_ELBOW), g(LM.L_WRIST));
    m['右肩角度'] = angleBetween(g(LM.R_HIP), g(LM.R_SHOULDER), g(LM.R_ELBOW));
  } else {
    m['右肘角度'] = angleBetween(g(LM.R_SHOULDER), g(LM.R_ELBOW), g(LM.R_WRIST));
    m['右膝角度'] = angleBetween(g(LM.R_HIP), g(LM.R_KNEE), g(LM.R_ANKLE));
    m['体幹傾き'] = trunkLean(world);
  }
  return m;
}

function trunkLean(world){
  const sh = world[LM.L_SHOULDER], sh2 = world[LM.R_SHOULDER];
  const hip = world[LM.L_HIP], hip2 = world[LM.R_HIP];
  const midSh = {x:(sh.x+sh2.x)/2, y:(sh.y+sh2.y)/2, z:(sh.z+sh2.z)/2};
  const midHip = {x:(hip.x+hip2.x)/2, y:(hip.y+hip2.y)/2, z:(hip.z+hip2.z)/2};
  const dx = midSh.x-midHip.x, dy = midSh.y-midHip.y;
  return Math.abs(Math.atan2(dx, -dy) * 180/Math.PI);
}

function renderMetrics(m){
  metricsEl.innerHTML = '';
  const fpsChip = document.createElement('div');
  fpsChip.className = 'chip';
  fpsChip.innerHTML = `FPS <b>${fpsCounter.fps.toFixed(0)}</b>`;
  metricsEl.appendChild(fpsChip);
  for(const [k,v] of Object.entries(m)){
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${k} <b>${v===null||v===undefined?'--':v.toFixed(1)+'°'}</b>`;
    metricsEl.appendChild(chip);
  }
}

async function loop(){
  if(!running) return;
  if(video.readyState >= 2 && video.currentTime !== lastVideoTime){
    lastVideoTime = video.currentTime;
    const t = performance.now();
    const result = poseLandmarker.detectForVideo(video, t);

    ctx.save();
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(result.landmarks && result.landmarks.length > 0){
      const drawer = new DrawingUtils(ctx);
      drawer.drawLandmarks(result.landmarks[0], {radius:3, color:'#4fd1c5'});
      drawer.drawConnectors(result.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, {color:'#f6ad5599', lineWidth:2});

      let world = result.worldLandmarks && result.worldLandmarks[0];
      if(world){
        if(!filters || filters.length !== world.length) initFilters(world.length);
        world = world.map((p,i)=>({
          x: filters[i].x.filter(p.x, t),
          y: filters[i].y.filter(p.y, t),
          z: filters[i].z.filter(p.z, t)
        }));
        const metrics = computeMetrics(world, exerciseSelect.value);
        renderMetrics(metrics);
        if(recording){
          const row = {t: Date.now(), ...metrics};
          logRows.push(row);
        }
      }
    } else {
      renderMetrics({});
    }
    ctx.restore();

    fpsCounter.frames++;
    if(t - fpsCounter.last > 500){
      fpsCounter.fps = fpsCounter.frames / ((t-fpsCounter.last)/1000);
      fpsCounter.frames = 0;
      fpsCounter.last = t;
    }
  }
  requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startCamera);

toggleCamBtn.addEventListener('click', async ()=>{
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if(currentStream){ currentStream.getTracks().forEach(tr=>tr.stop()); }
  currentStream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode, width:{ideal:960}, height:{ideal:1280} }, audio:false
  });
  video.srcObject = currentStream;
  await video.play();
  resizeCanvas();
});

recordBtn.addEventListener('click', ()=>{
  recording = !recording;
  recordBtn.textContent = recording ? 'ログ記録 停止 (' + 'CSV保存)' : 'ログ記録 開始';
  if(!recording && logRows.length){
    downloadCSV(logRows);
    logRows = [];
  }
});

function downloadCSV(rows){
  if(!rows.length) return;
  const keys = Array.from(rows.reduce((s,r)=>{Object.keys(r).forEach(k=>s.add(k)); return s;}, new Set()));
  const lines = [keys.join(',')];
  for(const r of rows){
    lines.push(keys.map(k=> r[k]!==undefined ? (typeof r[k]==='number'? r[k].toFixed(2): r[k]) : '').join(','));
  }
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `motion_log_${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
